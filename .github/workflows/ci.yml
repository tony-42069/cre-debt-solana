name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'
  SOLANA_VERSION: 'v1.18.18'

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            api/package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          cd api && npm ci
          cd ../app && npm ci

      - name: Run ESLint (API)
        run: cd api && npm run lint

      - name: Run ESLint (Frontend)
        run: cd app && npm run lint

      - name: TypeCheck (API)
        run: cd api && npx tsc --noEmit

      - name: TypeCheck (Frontend)
        run: cd app && npx tsc --noEmit

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_cre_debt
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        working-directory: ./api
        run: npm ci

      - name: Setup Database
        working-directory: ./api
        run: |
          npx prisma generate
          DATABASE_URL="postgresql://test:test@localhost:5432/test_cre_debt" npx prisma db push

      - name: Run tests
        working-directory: ./api
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_cre_debt
          JWT_SECRET: test-secret
        run: npm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./api/coverage/lcov.info
          flags: api

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Build frontend
        working-directory: ./app
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: app/.next/
          retention-days: 7

  smart-contract-build:
    name: Smart Contract Build
    runs-on: ubuntu-latest
    container:
      image: solanalabs/anchor:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build smart contracts
        run: anchor build

      - name: Run anchor tests
        run: anchor test --skip-local-validator

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: smart-contract-build
          path: |
            target/
            programs/**/target/
          retention-days: 7

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run npm audit (API)
        working-directory: ./api
        run: npm audit --audit-level=high --production

      - name: Run npm audit (Frontend)
        working-directory: ./app
        run: npm audit --audit-level=high --production

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, api-tests, frontend-build, smart-contract-build, security-scan]
    if: always()
    steps:
      - name: Send notification on failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "Workflow failed. Sending notification..."
          # Add your notification logic here (Slack, Discord, etc.)

      - name: Send notification on success
        if: contains(needs.*.result, 'success')
        run: |
          echo "Workflow succeeded!"
